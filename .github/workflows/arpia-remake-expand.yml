name: Expand Arpia v0.4 source

on:
  push:
    branches:
      - feat/arpia-remake-mvp
    paths:
      - 'arpia-remake/.payload-v04/**'
      - '.github/workflows/arpia-remake-expand.yml'

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/arpia-remake-mvp
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and expand source
        shell: bash
        run: |
          set -euo pipefail
          cat arpia-remake/.payload-v04/chunk-* > /tmp/arpia-v04.b64
          base64 --decode /tmp/arpia-v04.b64 > /tmp/arpia-v04.zip
          unzip -qo /tmp/arpia-v04.zip -d arpia-remake
          rm -rf arpia-remake/.payload-v04
          rm -f .github/workflows/arpia-remake-expand.yml

      - name: Verify static feature set
        working-directory: arpia-remake
        run: node scripts/check.mjs

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: expand Arpia remake v0.4 source'
          git push origin HEAD:feat/arpia-remake-mvp
