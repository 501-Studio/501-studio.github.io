name: Kotoba 0.3.6 complete verification
on:
  push:
    branches: [feat/kotoba-036-release-prep]
    paths: ['.github/workflows/kotoba-036.yml', 'release/v036-web-*', 'release/v036-postpatch.py', 'jlpt-quest/**', 'kotoba-android/**', 'billing-server/**']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: kotoba-036-release-prep
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KOTOBA_EVIDENCE_DIR: /tmp/kotoba036-qa
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct authored web and editorial source with checksum verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,json
          joined=''.join(Path(f'release/v036-web-part{i}.b64').read_text().strip() for i in range(1,11))
          data=base64.b64decode(joined,validate=True)
          Path('/tmp/kotoba036-qa').mkdir(exist_ok=True)
          Path('/tmp/kotoba036-qa/transferred-source.xz').write_bytes(data)
          actual=hashlib.sha256(data).hexdigest()
          assert actual=='62a714471e4c29c18bca9bebbdc9f9f50a7335ae170dedc17d42fc8de1453586',actual
          files=json.loads(lzma.decompress(data))
          for name,text in files.items():
            p=Path(name)
            assert not p.is_absolute() and '..' not in p.parts
            assert p.parts[0] in ['jlpt-quest','billing-server','kotoba-android','release-approval.example.json']
            p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
          print('Verified authored files:',len(files))
          PY
          python release/v036-postpatch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore baseline pronunciation assets from verified prior APK
        uses: actions/download-artifact@v4
        with:
          name: kotoba-0.3.5-full-offline
          run-id: 36235745463
          github-token: ${{ github.token }}
          path: /tmp/kotoba035-built
      - name: Extract offline audio only; keep corrected 0.3.6 source
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apk=next(Path('/tmp/kotoba035-built').rglob('*.apk'));root=Path('jlpt-quest')
          with zipfile.ZipFile(apk) as z:
            names=[n for n in z.namelist() if n.startswith('assets/www/data/audio/') and n.endswith('.ogg')]
            assert len(names)==7010,len(names)
            for name in names:
              p=root/name.removeprefix('assets/www/');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(name))
            for name in ['data/audio-manifest.json','data/audio-coverage.json']:(root/name).write_bytes(z.read('assets/www/'+name))
          print('Restored audio clips:',len(names))
          PY
      - name: Apply verified semantic and comma-format corrections
        working-directory: jlpt-quest
        run: npm run editorial:apply
      - name: Web engine and content regression tests
        working-directory: jlpt-quest
        run: npm test | tee /tmp/kotoba036-qa/node-tests.txt
      - name: Install backend and browser test dependencies
        run: |
          pip install -r billing-server/requirements.txt playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test purchase verification and signed entitlement rules
        working-directory: billing-server
        run: python -m unittest discover -s tests -v 2>&1 | tee /tmp/kotoba036-qa/backend-tests.txt
      - name: Verify actual rendered UI, fast touch strokes, local storage and offline audio
        working-directory: jlpt-quest
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/kotoba036-qa/http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          python tests/release036-browser.py
      - name: Confirm production release is blocked without real Console and QA approvals
        working-directory: jlpt-quest
        run: |
          set +e
          npm run release:check > /tmp/kotoba036-qa/release-gate.txt 2>&1
          STATUS=$?
          set -e
          cat /tmp/kotoba036-qa/release-gate.txt
          test "$STATUS" -ne 0
          grep -q 'RELEASE BLOCKED' /tmp/kotoba036-qa/release-gate.txt
      - name: Sync all corrected learning and offline media assets
        working-directory: jlpt-quest
        run: npm run android:sync
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build internal APK and AAB; test ad policy; run Android lint
        working-directory: kotoba-android
        run: gradle :app:assembleDebug :app:bundleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace | tee /tmp/kotoba036-qa/android-build.txt
      - name: Inspect actual APK assets and record checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          apk=Path('kotoba-android/app/build/outputs/apk/debug/app-debug.apk');aab=Path('kotoba-android/app/build/outputs/bundle/debug/app-debug.aab')
          with zipfile.ZipFile(apk) as z:
            assert z.testzip() is None
            for rel in ['src/app.js','src/stroke-pad.js','src/fit-text.js','src/commerce.js','release.css']:
              assert z.read('assets/www/'+rel)==(Path('jlpt-quest')/rel).read_bytes(),rel
            words=[]
            for l in ['N5','N4','N3','N2','N1']:words+=json.loads(z.read('assets/www/data/'+l+'.json'))['words']
            assert len(words)==8451 and all(w['language']=='ko' for w in words)
            assert next(w for w in words if w['word']=='おまわりさん')['meaning']=='경찰관, 순경'
            assert sum(n.startswith('assets/www/data/audio/') and n.endswith('.ogg') for n in z.namelist())==7010
          result={'version':'0.3.6','buildType':'internal-debug','apkBytes':apk.stat().st_size,'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'aabBytes':aab.stat().st_size,'aabSha256':hashlib.sha256(aab.read_bytes()).hexdigest(),'words':len(words),'audioClips':7010,'productionReady':False,'consoleWritesCompleted':False,'realBillingTested':False,'realAdMobConfigured':False}
          Path('/tmp/kotoba036-qa/package-check.json').write_text(json.dumps(result,ensure_ascii=False,indent=2));print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Preserve readable verified source in release-prep branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jlpt-quest/src/ jlpt-quest/tests/ jlpt-quest/scripts/ jlpt-quest/editorial/ jlpt-quest/release/ jlpt-quest/release.css jlpt-quest/index.html jlpt-quest/sw.js jlpt-quest/package.json jlpt-quest/README.md jlpt-quest/privacy.html jlpt-quest/terms.html jlpt-quest/licenses.html jlpt-quest/data/N1.json jlpt-quest/data/N2.json jlpt-quest/data/N3.json jlpt-quest/data/N4.json jlpt-quest/data/N5.json jlpt-quest/data/korean-glosses.json jlpt-quest/data/korean-coverage.json jlpt-quest/data/coverage.json billing-server/ kotoba-android/app/src/test/ release-approval.example.json
          git diff --cached --quiet || git commit -m 'feat(kotoba): preserve verified 0.3.6 app and release-preparation sources [skip ci]'
          git push origin HEAD:feat/kotoba-036-release-prep
      - name: Package complete source and submission drafts
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('/tmp/kotoba036-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for root in ['jlpt-quest','kotoba-android','billing-server']:
              for p in Path(root).rglob('*'):
                if not p.is_file() or any(x in p.parts for x in ['build','.gradle','__pycache__','node_modules']):continue
                if 'src/main/assets/' in str(p) or p.suffix in ['.keystore','.jks','.pem']:continue
                z.write(p,'kotoba-0.3.6/'+str(p))
            z.write('release-approval.example.json','kotoba-0.3.6/release-approval.example.json')
          with zipfile.ZipFile('/tmp/kotoba036-play-drafts.zip','w',zipfile.ZIP_DEFLATED) as z:
            for directory in ['release','editorial']:
              for p in Path('jlpt-quest',directory).rglob('*'):
                if p.is_file():z.write(p,str(p.relative_to('jlpt-quest')))
            for name in ['privacy.html','terms.html','licenses.html','CONTENT-LICENSE.md']:z.write(Path('jlpt-quest',name),name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kotoba-036-internal-build
          path: |
            kotoba-android/app/build/outputs/apk/debug/app-debug.apk
            kotoba-android/app/build/outputs/bundle/debug/app-debug.aab
            /tmp/kotoba036-source.zip
            /tmp/kotoba036-play-drafts.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotoba-036-verification
          path: |
            /tmp/kotoba036-qa/
            jlpt-quest/editorial/
            kotoba-android/app/build/reports/
            kotoba-android/app/build/test-results/
          retention-days: 30
