name: Dayboard v3 release
on:
  push:
    branches: [main, feat/dayboard-v3-adventure]
    paths: ['dayboard/**', 'infrastructure/**', 'tools/**', 'tests/**', '.github/workflows/dayboard-v3-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dayboard-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete source integration without touching accounts or data
        run: python3 tools/prepare-journey.py
      - name: Syntax and preserved priority rules
        run: |
          for f in dayboard/*.js; do node --check "$f"; done
          node .github/dayboard-v2-domain.mjs
      - name: Install pinned browser verifier
        run: |
          npm install --prefix /tmp/dayboard-ci --no-save --no-audit --no-fund playwright@1.57.0
          node /tmp/dayboard-ci/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify integrated routines, stats, adventure and mobile workflows
        env:
          DAYBOARD_PLAYWRIGHT: /tmp/dayboard-ci/node_modules/playwright
          DAYBOARD_LIVE_URL: https://dayboard-501.onrender.com
          VERIFY_LIVE: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: node tests/journey-release.cjs
      - name: Commit verified generated application files on the feature branch only
        if: ${{ success() && github.ref == 'refs/heads/feat/dayboard-v3-adventure' }}
        run: |
          if ! git diff --quiet -- dayboard; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add dayboard
            git commit -m 'Integrate verified Dayboard v3 application modules'
            git push origin HEAD:feat/dayboard-v3-adventure
          fi
      - name: Package source and evidence
        if: always()
        run: |
          mkdir -p dayboard-test-output
          git rev-parse HEAD > dayboard-test-output/source-commit.txt
          zip -qr dayboard-release-source.zip dayboard infrastructure .github tools tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dayboard-v3-release
          path: |
            dayboard-release-source.zip
            dayboard-test-output/
          retention-days: 1
