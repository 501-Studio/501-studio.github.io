name: Kotoba Android bridge compile
on:
  push:
    branches: [feature/kotoba-curriculum-v03]
    paths: ['kotoba-android/**', '.github/workflows/kotoba-android-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify actual Android and ML Kit APIs
        working-directory: kotoba-android
        run: gradle :app:compileDebugJavaWithJavac :app:lintDebug --stacktrace
      - name: Keep compiler and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-android-compile-evidence
          path: |
            kotoba-android/app/build/reports/
            kotoba-android/build/reports/
          if-no-files-found: ignore
          retention-days: 7
