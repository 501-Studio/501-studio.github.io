name: Weird Lab live browser checks
on:
  push:
    branches: [apps/weird-lab-20260918]
    paths:
      - 'weird-lab/**'
      - '.github/workflows/weird-lab-qa.yml'
permissions:
  contents: read
concurrency:
  group: weird-lab-browser-qa
  cancel-in-progress: true
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare browser test environment
        run: |
          mkdir -p "$RUNNER_TEMP/weirdlab-qa"
          cd "$RUNNER_TEMP/weirdlab-qa"
          npm init -y
          npm install playwright --no-fund --no-audit
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify live app, scoring, privacy, downloads and responsive layouts
        env:
          BASE_URL: https://weird-lab-501.onrender.com
        run: |
          cd "$RUNNER_TEMP/weirdlab-qa"
          cat > verify.cjs <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const crypto=require('node:crypto');
          const out=path.join(process.env.RUNNER_TEMP,'weird-lab-evidence');
          fs.mkdirSync(out,{recursive:true});
          const report={url:process.env.BASE_URL,checks:[],errors:[],screenshots:[]};
          const pass=(name,detail)=>{report.checks.push({name,status:'passed',detail});console.log('PASS:',name,detail||'');};
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          (async()=>{
            const browser=await chromium.launch();
            try {
              const base=process.env.BASE_URL;
              for(const file of ['index.html','app.js','data.js','style.css','favicon.svg']){
                const response=await fetch(`${base}/${file}?qa=${process.env.GITHUB_SHA}`);
                assert.equal(response.status,200,`${file} HTTP status`);
                const bytes=Buffer.from(await response.arrayBuffer());
                const local=fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE,'weird-lab',file));
                assert.equal(hash(bytes),hash(local),`${file} live source matches checkout`);
              }
              pass('Live HTTPS assets match committed source');
              const context=await browser.newContext({viewport:{width:1440,height:1000},acceptDownloads:true,permissions:['clipboard-read','clipboard-write']});
              const page=await context.newPage();
              page.on('pageerror',e=>report.errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error')report.errors.push(m.text());});
              const goto=async(route='')=>{await page.goto(base+'/'+route);await page.locator('#main h1').waitFor();};
              const screenshot=async(name,fullPage=false)=>{await page.screenshot({path:path.join(out,name),fullPage});report.screenshots.push(name);};
              await goto();
              assert.match(await page.title(),/쓸데없는 연구소/);
              assert.equal(await page.locator('.test-card').count(),10);
              const data=await page.evaluate(()=>window.WEIRD_DATA);
              assert.equal(data.length,10);
              assert.equal(data.reduce((n,t)=>n+t.questions.length,0),100);
              for(const t of data){assert.equal(t.questions.length,10);if(!t.party){assert.equal(t.types.length,4);for(const q of t.questions)assert.equal(q.length,5);}}
              pass('100 questions, 10 tests and 36 solo character endings');
              await screenshot('desktop-home.png');
              await page.locator('[data-filter="현실 생존"]').click();assert.equal(await page.locator('.test-card').count(),3);
              await page.locator('[data-filter="관계 탐구"]').click();assert.equal(await page.locator('.test-card').count(),2);
              await page.locator('[data-filter="전체"]').click();
              await page.locator('#search').fill('RPG');assert.equal(await page.locator('.test-card').count(),1);
              await page.locator('#search').fill('검색결과없는말');assert.equal(await page.locator('.test-card').count(),0);
              await page.locator('[data-action="reset-search"]').click();assert.equal(await page.locator('.test-card').count(),10);
              pass('Category filters, search and empty state');
              for(const t of data.filter(t=>!t.party)){
                await goto(`#/test/${t.id}`);await page.locator('[data-action="start"]').click();
                for(let q=0;q<10;q++){
                  assert.match(await page.locator('.progress-top b').innerText(),new RegExp(String(q+1).padStart(2,'0')));
                  assert.equal(await page.locator('[data-action="next"]').isDisabled(),true);
                  await page.locator(`[data-action="answer"][data-value="${q%4}"]`).click();
                  if(t.id==='rpg'&&q===3){await page.reload();await page.locator('.answer.selected').waitFor();assert.equal(await page.locator('[data-action="next"]').isEnabled(),true);}
                  if(t.id==='rpg'&&q===4)await screenshot('desktop-question.png');
                  await page.locator('[data-action="next"]').click();
                }
                await page.locator('.result-ticket').waitFor();
                assert.ok(page.url().includes(`/result/${t.id}/3-3-2-2`));
                assert.equal(await page.locator('.result-upper h2').innerText(),t.types[0][0]);
              }
              pass('All nine solo quizzes complete; reload resumes selected answer');
              for(const t of data.filter(t=>!t.party))for(let i=0;i<4;i++){
                const c=[0,0,0,0];c[i]=10;
                await goto(`#/result/${t.id}/${c.join('-')}`);
                assert.equal(await page.locator('.result-upper h2').innerText(),t.types[i][0]);
              }
              pass('Every solo character outcome is reachable');
              await goto('#/result/rpg/10-0-0-0');
              await screenshot('desktop-result.png',true);
              await page.locator('[data-action="save"]').click();
              await page.locator('[data-action="save"]').click();
              assert.equal(await page.locator('#saved-count').innerText(),'1');
              await page.locator('[data-action="copy"]').click();
              const shared=await page.evaluate(()=>navigator.clipboard.readText());
              assert.equal(shared,base+'/#/result/rpg/10-0-0-0');
              const downloadPromise=page.waitForEvent('download');
              await page.locator('[data-action="download"]').click();
              const download=await downloadPromise;await download.saveAs(path.join(out,'solo-result-card.png'));
              assert.ok(fs.statSync(path.join(out,'solo-result-card.png')).size>10000);
              await goto('#/saved');assert.equal(await page.locator('.saved-item').count(),1);
              await page.locator('[data-action="delete-saved"]').click();assert.equal(await page.locator('.saved-item').count(),0);
              pass('PNG download, clipboard link, deduplicated saved results and delete');
              await goto('#/test/marry');await page.locator('[data-action="start"]').click();
              assert.match(await page.locator('#form-error').innerText(),/2~6/);
              await page.locator('#party-names').fill('감자, 감자');await page.locator('[data-action="start"]').click();assert.match(await page.locator('#form-error').innerText(),/서로 다른/);
              await page.locator('#party-names').fill('딩거, 감자, 우주');await page.locator('[data-action="start"]').click();
              for(let q=0;q<10;q++){await page.locator(`[data-action="answer"][data-value="${q%2}"]`).click();await page.locator('[data-action="next"]').click();}
              await page.locator('.ranking').waitFor();assert.equal(await page.locator('.rank-row.winner').count(),2);
              assert.match(await page.locator('.ranking').innerText(),/딩거/);
              const groupURL=page.url();assert.equal(groupURL,base+'/#/result/marry/5-5-0');
              const partyDownloadPromise=page.waitForEvent('download');await page.locator('[data-action="download"]').click();await(await partyDownloadPromise).saveAs(path.join(out,'party-result-card.png'));
              const anonymous=await browser.newContext();const anon=await anonymous.newPage();await anon.goto(groupURL);await anon.locator('.ranking').waitFor();assert.match(await anon.locator('.ranking').innerText(),/친구 1/);assert.doesNotMatch(await anon.locator('.ranking').innerText(),/딩거|감자|우주/);await anonymous.close();
              pass('Party input validation, joint first place, names omitted from shared link');
              await goto('#/test/marry');await page.locator('#party-names').fill('<img>, 두번째');await page.locator('[data-action="start"]').click();assert.equal(await page.locator('.answers img').count(),0);assert.match(await page.locator('.answers').innerText(),/<img>/);
              pass('Nickname HTML escaping');
              await goto('#/test/grad');await page.locator('[data-action="start"]').click();await page.locator('[data-value="0"]').click();await page.locator('[data-action="next"]').click();await page.locator('[data-value="1"]').click();await page.locator('[data-action="previous"]').click();assert.equal(await page.locator('.answer.selected').getAttribute('data-value'),'0');await page.locator('[data-value="3"]').click();await page.locator('[data-action="next"]').click();assert.equal(await page.locator('.answer.selected').getAttribute('data-value'),'1');
              await page.locator('[data-action="exit"]').click();assert.equal(await page.locator('#leave-dialog').isVisible(),true);await page.locator('#stay').click();assert.equal(await page.locator('#leave-dialog').isVisible(),false);
              pass('Back navigation, answer editing and exit cancellation');
              await goto('#/result/rpg/99-0-0-0');assert.match(await page.locator('#main h1').innerText(),/찾을 수 없어요/);
              await goto('#/result/marry/10');assert.match(await page.locator('#main h1').innerText(),/찾을 수 없어요/);
              pass('Malformed result URLs rejected');
              await goto('#/result/love/0-0-10-0');
              await page.evaluate(()=>{Object.defineProperty(navigator,'share',{value:undefined,configurable:true});Object.defineProperty(navigator,'clipboard',{value:undefined,configurable:true});});
              await page.locator('[data-action="share"]').click();assert.ok(await page.locator('.copy-fallback').isVisible());
              pass('Share and clipboard unavailable fallback');
              await goto('#/privacy');await page.locator('[data-action="clear-data"]').click();await page.locator('#leave').click();assert.equal(await page.evaluate(()=>sessionStorage.getItem('weirdlab.v1.session')),null);
              pass('Explicit browser data deletion');
              for(const width of [320,390,768,1440]){
                await page.setViewportSize({width,height:844});await goto();
                assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth),false,`home overflow at ${width}`);
                if(width===390)await screenshot('mobile-home.png',true);
                await goto('#/result/grad/0-0-10-0');
                assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth),false,`result overflow at ${width}`);
                if(width===390)await screenshot('mobile-result.png',true);
              }
              pass('No horizontal overflow at 320, 390, 768 and 1440 pixels');
              assert.deepEqual(report.errors,[]);pass('No browser JavaScript or console errors');
              report.success=true;
              fs.cpSync(path.join(process.env.GITHUB_WORKSPACE,'weird-lab'),path.join(out,'source'),{recursive:true});
            } catch(e){report.success=false;report.failure=e.stack;throw e;}
            finally{fs.writeFileSync(path.join(out,'verification.json'),JSON.stringify(report,null,2));await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
          node verify.cjs
      - name: Collect browser verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weird-lab-browser-evidence
          path: ${{ runner.temp }}/weird-lab-evidence/
          retention-days: 7
          if-no-files-found: warn
