name: SimsimLAB Astro staging validation
on:
  push:
    branches: [simsim-lab-staging-20260919]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simsim-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify generated international routes
        run: |
          test -f dist/en/tests/zombie-survival/index.html
          test -f dist/ko/tests/rpg-class/index.html
          test -f dist/ar/tests/dating-style/index.html
          test -f dist/zh-CN/tests/friendship-compatibility/index.html
          grep -q 'dir="rtl"' dist/ar/tests/dating-style/index.html
          grep -q 'hreflang="x-default"' dist/ja/tests/rpg-class/index.html
          count=$(find dist -path '*/tests/*/index.html' | wc -l)
          test "$count" -eq 700
