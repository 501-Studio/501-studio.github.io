name: Kotoba 0.3.7 neural audio
on:
  push:
    branches: [feat/kotoba-037-learning]
    paths: [.github/workflows/kotoba-neural037.yml, release/build-neural037.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'kokoro==0.9.4' 'misaki[ja]' 'transformers<4.51' soundfile numpy
          python -m unidic download
      - run: python release/build-neural037.py --shard ${{ matrix.shard }} --shards 8
      - uses: actions/upload-artifact@v4
        with:
          name: neural037-shard-${{ matrix.shard }}
          path: /tmp/neural037/
          retention-days: 30
  assemble:
    needs: synthesize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: neural037-shard-*
          path: /tmp/neural037
          merge-multiple: true
      - name: Validate each generated clip and manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('/tmp/neural037');m=json.loads((p/'audio-manifest.json').read_text());names=set(m['clips'].values())
          assert names=={f.name for f in p.glob('*.ogg')}
          records=[]
          for f in p.glob('shard-*.json'):records+=json.loads(f.read_text())['records']
          assert len(records)==len(names)
          for r in records:
            b=(p/r['file']).read_bytes();assert b[:4]==b'OggS' and len(b)>180
            assert hashlib.sha256(b).hexdigest()==r['sha256']
            assert .1<=r['seconds']<20
          (p/'audio-coverage.json').write_text(json.dumps({'complete':True,'words':len(m['clips']),'uniqueClips':len(names),'bytes':sum((p/n).stat().st_size for n in names),'generator':m['generator'],'records':records},ensure_ascii=False))
          print('Verified',len(names),'new neural audio clips')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kotoba037-neural-audio
          path: /tmp/neural037/
          retention-days: 30
