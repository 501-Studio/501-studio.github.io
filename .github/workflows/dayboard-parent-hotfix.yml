name: Dayboard parent integrity hotfix
on:
  push:
    branches: [fix/dayboard-parent-validation]
    paths: ['dayboard/**', 'tools/apply-parent-hotfix.py', 'tests/**', 'infrastructure/**', '.github/workflows/dayboard-parent-hotfix.yml']
permissions:
  contents: write
concurrency:
  group: dayboard-parent-hotfix
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed source-only patch
        run: python3 tools/apply-parent-hotfix.py
      - name: Shared validation and preserved priority regression
        run: |
          node tests/parent-integrity.mjs
          node .github/dayboard-v2-domain.mjs
      - name: Install existing pinned browser verifier
        run: |
          npm install --prefix /tmp/dayboard-ci --no-save --no-audit --no-fund playwright@1.57.0
          node /tmp/dayboard-ci/node_modules/playwright/cli.js install --with-deps chromium
      - name: Reproduce and recover from malformed hierarchy; verify all v3 actions
        env:
          DAYBOARD_PLAYWRIGHT: /tmp/dayboard-ci/node_modules/playwright
          VERIFY_LIVE: '0'
        run: |
          node tests/parent-ui.cjs
          node tests/journey-release.cjs
      - name: Commit verified sources to the fix branch only
        if: success() && github.ref == 'refs/heads/fix/dayboard-parent-validation'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dayboard/core.js dayboard/app.js dayboard/journey-shell.js dayboard/launch.js dayboard/index.html dayboard/CHATGPT.md tests/journey-release.cjs
          git commit -m 'Integrate tested Dayboard 3.0.1 hierarchy and save-state fixes'
          git push origin HEAD:fix/dayboard-parent-validation
      - name: Package diagnostic evidence
        if: always()
        run: |
          mkdir -p dayboard-test-output
          git rev-parse HEAD > dayboard-test-output/source-commit.txt
          zip -qr dayboard-parent-source.zip dayboard infrastructure tests .github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dayboard-parent-verification
          path: |
            dayboard-parent-source.zip
            dayboard-test-output/
          retention-days: 1
