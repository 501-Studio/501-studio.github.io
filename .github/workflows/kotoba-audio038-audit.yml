name: Kotoba 0.3.8 complete audio audit
on:
  push:
    branches: [fix/kotoba-038-audio-audit]
    paths: [.github/workflows/kotoba-audio038-audit.yml, release/audit-repair-audio038.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repair:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: kotoba037-neural-audio
          run-id: 36303442278
          github-token: ${{ github.token }}
          path: /tmp/neural037
      - name: Install synthesis, waveform and independent ASR tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install kokoro==0.9.4 'misaki[ja]==0.9.4' 'transformers<4.51' soundfile scipy numpy faster-whisper==1.2.1 pykakasi
          python -m unidic download
      - run: python release/audit-repair-audio038.py --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio038-shard-${{ matrix.shard }}
          path: /tmp/audio038/
          retention-days: 14
  assemble:
    needs: repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: audio038-shard-*
          path: /tmp/audio038
          merge-multiple: true
      - name: Verify complete old/new audits, mapping, hashes and non-silent output
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,csv
          p=Path('/tmp/audio038');m=json.loads((p/'audio-manifest.json').read_text());rows=[]
          for i in range(8):
            data=json.loads((p/f'audit-{i}.json').read_text());assert data['summary']['complete'];rows+=data['records']
          names=set(m['clips'].values());assert len(rows)==len(names)==7050
          assert names=={r['file'] for r in rows}=={f.name for f in (p/'audio').glob('*.ogg')}
          assert len(m['clips'])==8613 and len({i for r in rows for i in r['ids']})==8613
          for r in rows:
            data=(p/'audio'/r['file']).read_bytes();assert data[:4]==b'OggS';assert hashlib.sha256(data).hexdigest()==r['sha256']
            assert r['after']['clippedSamples']==0 and r['after']['truePeakDb']<-.5
            assert 'asrBefore' in r and 'asrAfter' in r
          coverage={'version':3,'complete':True,'words':len(m['clips']),'uniqueClips':len(names),'bytes':sum((p/'audio'/n).stat().st_size for n in names),'generator':m['generator'],'records':rows}
          (p/'audio-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,separators=(',',':')))
          summary={'version':'0.3.8','oldFilesDecoded':len(rows),'newFilesDecoded':len(rows),'allWordAndKanaIds':8613,'missingFiles':0,'hashErrors':0,'clippedFiles':0,'sourceReadingCorrections':m['readingCorrections'],'frontendChanged':sum(r['frontendChanged'] for r in rows),'asrBeforeMatches':sum(r['asrBefore']['phoneticMatch'] for r in rows),'asrAfterMatches':sum(r['asrAfter']['phoneticMatch'] for r in rows),'pronunciationReviewRequired':sum(r['pronunciationReviewRequired'] for r in rows),'independentNativeReview':False,'note':'ASR is an unprompted screening check, not human approval; all mismatches are included in the CSV.'}
          (p/'audio-audit-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          with (p/'audio-audit.csv').open('w',encoding='utf-8-sig',newline='') as f:
            writer=csv.writer(f);writer.writerow(['file','ids','old_reading','reading','spoken','frontend_changed','before_asr','after_asr','asr_match','requires_review','old_seconds','new_seconds','old_rms_db','new_rms_db','new_true_peak_db'])
            for r in rows:writer.writerow([r['file'],';'.join(r['ids']),r['oldReading'],r['reading'],r['spokenText'],r['frontendChanged'],r['asrBefore']['text'],r['asrAfter']['text'],r['asrAfter']['phoneticMatch'],r['pronunciationReviewRequired'],r['before']['seconds'],r['after']['seconds'],r['before']['activeRmsDb'],r['after']['activeRmsDb'],r['after']['truePeakDb']])
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kotoba038-audited-audio
          path: /tmp/audio038/
          retention-days: 30
