# Historical v2 checks remain available manually. V3 release CI now gates main.
name: Dayboard v2 historical checks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node .github/dayboard-v2-domain.mjs
