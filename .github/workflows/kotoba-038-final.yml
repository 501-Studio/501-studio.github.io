name: Kotoba 038 final internal verification
on:
  push:
    branches: [feat/kotoba-038-study-flow]
    paths: [.github/workflows/kotoba-038-final.yml, release/finalize038.py, release/prepare-examples038.py, release/correct-context038.py, release/package038.py, 'release/examples038/**', jlpt-quest/tests/examples038.test.mjs, jlpt-quest/tests/examples038-browser.py]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: kotoba038-final
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  KOTOBA_EVIDENCE_DIR: /tmp/kotoba038-final-qa
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/kotoba-038-study-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependencies
        run: |
          mkdir -p /tmp/kotoba038-final-qa
          pip install pykakasi==2.3.0 playwright==1.57.0
      - uses: actions/download-artifact@v4
        with:
          name: kotoba038-korean-examples
          run-id: 36417868276
          github-token: ${{ github.token }}
          path: /tmp/kotoba038-pivot
      - uses: actions/download-artifact@v4
        with:
          name: kotoba038-direct-korean
          run-id: 36418951093
          github-token: ${{ github.token }}
          path: /tmp/kotoba038-partial
      - name: Assemble complete input with actual per-entry provenance
        run: |
          python release/prepare-examples038.py
          python release/finalize038.py
          python release/correct-context038.py
      - uses: actions/download-artifact@v4
        with:
          name: kotoba037-neural-audio
          run-id: 36303442278
          github-token: ${{ github.token }}
          path: /tmp/neural037
      - name: Restore checksummed offline word audio
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,shutil,hashlib
          src=Path('/tmp/neural037');dst=Path('jlpt-quest/data/audio');dst.mkdir(exist_ok=True)
          for r in json.loads((src/'audio-coverage.json').read_text())['records']:
            f=src/r['file'];assert hashlib.sha256(f.read_bytes()).hexdigest()==r['sha256'];shutil.copyfile(f,dst/f.name)
          PY
      - name: Regression and all-word coverage tests
        working-directory: jlpt-quest
        run: |
          npm test 2>&1 | tee /tmp/kotoba038-final-qa/node.txt
          node --test tests/examples038.test.mjs 2>&1 | tee /tmp/kotoba038-final-qa/coverage-tests.txt
          node scripts/verify-bundled-assets.mjs 2>&1 | tee /tmp/kotoba038-final-qa/assets.txt
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Actual Chromium interaction and mobile layout verification
        working-directory: jlpt-quest
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/kotoba038-final-qa/http.txt 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          python tests/release038-browser.py
          python tests/examples038-browser.py
          python tests/release037-browser.py
          python tests/release036-browser.py
      - name: Preserve production approval gate
        working-directory: jlpt-quest
        run: |
          set +e
          npm run release:check > /tmp/kotoba038-final-qa/release-gate.txt 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -q 'RELEASE BLOCKED' /tmp/kotoba038-final-qa/release-gate.txt
      - name: Preserve exact verified web corpus on feature branch only
        run: |
          git fetch origin feat/kotoba-038-study-flow
          test -z "$(git diff --name-only HEAD origin/feat/kotoba-038-study-flow -- jlpt-quest kotoba-android)"
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          paths=json.loads(Path('/tmp/kotoba038-final-paths.json').read_text())
          subprocess.run(['git','add','--']+paths,check=True)
          PY
          git config user.name '501-Studio'
          git config user.email '501.dingerlab@gmail.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(kotoba): preserve tested all-word examples for internal 038 [skip ci]'
            git pull --rebase origin feat/kotoba-038-study-flow
            git push origin HEAD:feat/kotoba-038-study-flow
          fi
      - name: Sync exact tested assets
        working-directory: jlpt-quest
        run: npm run android:sync
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build internal APK AAB and Android unit tests and lint
        working-directory: kotoba-android
        run: gradle --no-daemon assembleDebug bundleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug 2>&1 | tee /tmp/kotoba038-final-qa/gradle-build.txt
      - name: Enable KVM for rotation test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android Activity recreation and rotation regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Asia/Seoul
          script: |
            gradle -p kotoba-android --no-daemon connectedDebugAndroidTest
            adb exec-out screencap -p > /tmp/kotoba038-final-qa/android-device.png
      - name: Inspect APK asset identity and package tested source
        run: |
          python release/package038.py
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs /tmp/kotoba038-build/kotoba-v0.3.8-internal.apk > /tmp/kotoba038-final-qa/apk-signature.txt
      - name: Preserve source checkpoint for reproducible inspection
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('/tmp/kotoba038-inspection.zip','w',zipfile.ZIP_DEFLATED) as z:
            for base in ['jlpt-quest','kotoba-android','release','.github/workflows']:
              for p in Path(base).rglob('*'):
                if not p.is_file() or any(x in p.parts for x in ['.git','.gradle','build','__pycache__','node_modules','audio','www']):continue
                if p.suffix in ['.b64','.part1','.part2','.pyc','.pem','.key','.jks','.keystore','.ttf','.otf','.woff','.woff2'] or p.name in ['local.properties','.env']:continue
                z.write(p,p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotoba038-inspection-source
          path: /tmp/kotoba038-inspection.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotoba038-verified-build
          path: /tmp/kotoba038-build/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotoba038-final-verification
          path: |
            /tmp/kotoba038-final-qa/
            kotoba-android/app/build/reports/
            kotoba-android/app/build/outputs/androidTest-results/
            kotoba-android/app/build/test-results/
          retention-days: 30
