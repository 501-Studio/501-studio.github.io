name: Kotoba 038 final internal verification
on:
  push:
    branches: [feat/kotoba-038-study-flow]
    paths: [.github/workflows/kotoba-038-final.yml, release/finalize038.py, release/examples038/corrections.json, jlpt-quest/tests/examples038.test.mjs, jlpt-quest/tests/examples038-browser.py]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: kotoba038-final
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  KOTOBA_EVIDENCE_DIR: /tmp/kotoba038-final-qa
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/kotoba-038-study-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependencies
        run: |
          mkdir -p /tmp/kotoba038-final-qa
          pip install pykakasi==2.3.0 playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Wait for the fixed direct-translation input run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            STATUS=$(gh api repos/501-Studio/501-studio.github.io/actions/runs/36418951093 --jq .status)
            if [ "$STATUS" = completed ]; then
              test "$(gh api repos/501-Studio/501-studio.github.io/actions/runs/36418951093 --jq .conclusion)" = success
              exit 0
            fi
            sleep 10
          done
          echo 'Input run did not finish; no incomplete corpus will be published.'
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: kotoba038-direct-korean
          run-id: 36418951093
          github-token: ${{ github.token }}
          path: /tmp/kotoba038-direct
      - name: Assemble and verify all vocabulary examples
        run: python release/finalize038.py
      - uses: actions/download-artifact@v4
        with:
          name: kotoba037-neural-audio
          run-id: 36303442278
          github-token: ${{ github.token }}
          path: /tmp/neural037
      - name: Restore checksummed offline word audio
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,shutil,hashlib
          src=Path('/tmp/neural037');dst=Path('jlpt-quest/data/audio');dst.mkdir(exist_ok=True)
          for r in json.loads((src/'audio-coverage.json').read_text())['records']:
            f=src/r['file'];assert hashlib.sha256(f.read_bytes()).hexdigest()==r['sha256'];shutil.copyfile(f,dst/f.name)
          PY
      - name: Regression and all-word coverage tests
        working-directory: jlpt-quest
        run: |
          npm test 2>&1 | tee /tmp/kotoba038-final-qa/node.txt
          node --test tests/examples038.test.mjs 2>&1 | tee /tmp/kotoba038-final-qa/coverage-tests.txt
          node scripts/verify-bundled-assets.mjs 2>&1 | tee /tmp/kotoba038-final-qa/assets.txt
      - name: Actual Chromium interaction and mobile layout verification
        working-directory: jlpt-quest
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/kotoba038-final-qa/http.txt 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          python tests/release038-browser.py
          python tests/examples038-browser.py
          python tests/release037-browser.py
          python tests/release036-browser.py
      - name: Preserve production approval gate
        working-directory: jlpt-quest
        run: |
          set +e
          npm run release:check > /tmp/kotoba038-final-qa/release-gate.txt 2>&1
          STATUS=$?
          set -e
          cat /tmp/kotoba038-final-qa/release-gate.txt
          test "$STATUS" -ne 0
          grep -q 'RELEASE BLOCKED' /tmp/kotoba038-final-qa/release-gate.txt
      - name: Sync exact tested assets
        working-directory: jlpt-quest
        run: npm run android:sync
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build internal APK and AAB and run Android tests and lint
        working-directory: kotoba-android
        run: gradle --no-daemon assembleDebug bundleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug 2>&1 | tee /tmp/kotoba038-final-qa/gradle-build.txt
      - name: Enable KVM for rotation test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android Activity recreation and rotation regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Asia/Seoul
          script: |
            gradle -p kotoba-android --no-daemon connectedDebugAndroidTest
            adb exec-out screencap -p > /tmp/kotoba038-final-qa/android-device.png
      - name: Inspect APK asset identity and package tested source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib,shutil
          w=Path('jlpt-quest');out=Path('/tmp/kotoba038-build');out.mkdir(exist_ok=True)
          apk=Path('kotoba-android/app/build/outputs/apk/debug/app-debug.apk');aab=Path('kotoba-android/app/build/outputs/bundle/debug/app-debug.aab');checked=[]
          with zipfile.ZipFile(apk) as z:
            for n in z.namelist():
              if n.startswith('assets/www/') and not n.endswith('/'):
                p=w/n.removeprefix('assets/www/');assert p.is_file() and z.read(n)==p.read_bytes(),n;checked.append(n)
          coverage=json.loads((w/'data/example-coverage.json').read_text())
          report={'version':'0.3.8-internal','versionCode':11,'apkBytes':apk.stat().st_size,'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'aabBytes':aab.stat().st_size,'aabSha256':hashlib.sha256(aab.read_bytes()).hexdigest(),'byteIdenticalWebAssets':len(checked),'audioClips':len(list((w/'data/audio').glob('*.ogg'))),'examples':coverage,'productionReleased':False,'physicalDeviceAudioVerified':False,'signing':'Ephemeral internal debug key; back up records before attempting an update'}
          Path('/tmp/kotoba038-final-qa/package-check.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          shutil.copyfile(apk,out/'kotoba-v0.3.8-internal.apk');shutil.copyfile(aab,out/'kotoba-v0.3.8-internal.aab')
          with zipfile.ZipFile(out/'kotoba-v0.3.8-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for base in ['jlpt-quest','kotoba-android','billing-server','release','.github/workflows']:
              for p in Path(base).rglob('*'):
                if not p.is_file() or any(x in p.parts for x in ['.git','.gradle','build','__pycache__','node_modules']):continue
                if p.suffix in ['.b64','.pyc','.pem','.key','.jks','.keystore','.ttf','.otf','.woff','.woff2'] or p.name in ['local.properties','.env'] or 'assets/www' in str(p):continue
                z.write(p,Path('kotoba-0.3.8')/p)
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs /tmp/kotoba038-build/kotoba-v0.3.8-internal.apk > /tmp/kotoba038-final-qa/apk-signature.txt
      - name: Preserve exact verified corpus on feature branch only
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          paths=json.loads(Path('/tmp/kotoba038-final-paths.json').read_text())
          subprocess.run(['git','add','--']+paths,check=True)
          PY
          git config user.name '501-Studio'
          git config user.email '501.dingerlab@gmail.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(kotoba): preserve tested all-word examples and internal 038 assets [skip ci]'
            git push origin HEAD:feat/kotoba-038-study-flow
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kotoba038-verified-build
          path: /tmp/kotoba038-build/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotoba038-final-verification
          path: |
            /tmp/kotoba038-final-qa/
            kotoba-android/app/build/reports/
            kotoba-android/app/build/outputs/androidTest-results/
            kotoba-android/app/build/test-results/
          retention-days: 30
