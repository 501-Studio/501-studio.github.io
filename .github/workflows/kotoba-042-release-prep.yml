name: JLPT Kotoba 042 release preparation
on:
  push:
    branches: [feat/jlpt-kotoba-play-release]
    paths: [jlpt-quest/**, kotoba-android/**, billing-server/**, .github/workflows/kotoba-042-release-prep.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kotoba042-release-prep
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == '501-Studio/501-studio.github.io' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KOTOBA_EVIDENCE_DIR: /tmp/kotoba042-qa
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests and learning assets
        id: unit_tests
        working-directory: jlpt-quest
        run: |
          mkdir -p /tmp/kotoba042-qa
          set -o pipefail
          npm test 2>&1 | tee /tmp/kotoba042-qa/node.txt
          node scripts/verify-bundled-assets.mjs
      - name: Receipt verification tests
        id: receipt_tests
        working-directory: billing-server
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Docker privilege drop and durable storage smoke test
        id: docker_smoke
        run: |
          docker build -t kotoba-verifier-test billing-server
          docker volume create kotoba-qa-data
          trap 'docker rm -f kotoba-verifier-test || true; docker volume rm kotoba-qa-data || true' EXIT
          docker run -d --name kotoba-verifier-test -p 127.0.0.1:8080:8080 -e SQLITE_PATH=/var/data/kotoba/receipts.sqlite3 -v kotoba-qa-data:/var/data kotoba-verifier-test
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --retry-max-time 45 --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/health > /tmp/kotoba042-qa/backend-health.json
          python -c "import json; d=json.load(open('/tmp/kotoba042-qa/backend-health.json')); assert not d['configured'] and not d['ready']"
          docker exec -u app kotoba-verifier-test python -c "import os,sqlite3; assert os.getuid()!=0; db=sqlite3.connect('/var/data/kotoba/receipts.sqlite3'); db.execute('CREATE TABLE smoke (value TEXT)'); db.execute('INSERT INTO smoke VALUES (?)',('durable',)); db.commit(); db.close()"
          docker restart kotoba-verifier-test
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --retry-max-time 45 --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/health > /tmp/kotoba042-qa/backend-health-restarted.json
          docker exec -u app kotoba-verifier-test python -c "import os,sqlite3,stat; p='/var/data/kotoba/receipts.sqlite3'; assert stat.S_IMODE(os.stat(p).st_mode)==0o600; db=sqlite3.connect(p); assert db.execute('SELECT value FROM smoke').fetchone()[0]=='durable'; db.close(); print('Non-root durable restart passed')"
      - name: Browser regression
        id: browser_regression
        working-directory: jlpt-quest
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/kotoba042-qa/http.txt 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          STATUS=0
          for SUITE in tutorial041 continuation040 autopronounce041 advanced040 personal039 release038 examples038 release037 release036; do
            python "tests/${SUITE}-browser.py" >"/tmp/kotoba042-qa/${SUITE}.txt" 2>&1 || STATUS=1
            cat "/tmp/kotoba042-qa/${SUITE}.txt"
          done
          exit "$STATUS"
      - name: Verify unresolved production checks remain visible
        id: release_gate
        working-directory: jlpt-quest
        run: |
          set +e
          npm run release:check > /tmp/kotoba042-qa/release-gate.txt 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -q 'RELEASE BLOCKED' /tmp/kotoba042-qa/release-gate.txt
      - name: Summarize verification without stored artifacts
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit_tests.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt_tests.outcome }}
          DOCKER_OUTCOME: ${{ steps.docker_smoke.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_regression.outcome }}
          RELEASE_GATE_OUTCOME: ${{ steps.release_gate.outcome }}
        run: |
          python3 - <<'QA_SUMMARY'
          import json, os, pathlib, re
          root = pathlib.Path('/tmp/kotoba042-qa')
          log = (root / 'node.txt').read_text(errors='replace') if (root / 'node.txt').exists() else ''
          counts = {}
          for key in ['tests', 'suites', 'pass', 'fail', 'cancelled', 'skipped', 'todo']:
              matches = re.findall(r'^# ' + key + r' (\d+)$', log, re.M)
              counts[key] = int(matches[-1]) if matches else None
          result = {'schemaVersion': 1, 'nodeCounts': counts,
                    'stepOutcomes': {key: os.environ.get(key, 'unknown') for key in
                                     ['UNIT_OUTCOME', 'RECEIPT_OUTCOME', 'DOCKER_OUTCOME', 'BROWSER_OUTCOME', 'RELEASE_GATE_OUTCOME']},
                    'artifactUploadPerformed': False, 'cacheUploadPerformed': False,
                    'productionReleaseApproved': False}
          print('KOTOBA_WEB_VERIFICATION_JSON=' + json.dumps(result, separators=(',', ':')))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Web and backend regression\n\n')
              summary.write('Existing test/build/blocked-release checks retain their exit status. No cache or artifact upload. Results and failures remain in the job log. No deployment or release approval.\n\n')
              summary.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          QA_SUMMARY
  android:
    if: github.repository == '501-Studio/501-studio.github.io' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize current web source
        working-directory: jlpt-quest
        run: npm run android:sync
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Android internal APK and AAB, JVM tests and lint
        id: android_build
        working-directory: kotoba-android
        run: |
          mkdir -p /tmp/kotoba042-qa
          set -o pipefail
          gradle --no-daemon assembleDebug bundleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug 2>&1 | tee /tmp/kotoba042-qa/gradle.txt
      - name: Verify internal package identity and APK signature
        id: identity_guard
        working-directory: kotoba-android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/kotoba042-qa/package.txt
          grep -q "name='com.studio501.kotoba.debug'" /tmp/kotoba042-qa/package.txt
          grep -q "versionCode='15'" /tmp/kotoba042-qa/package.txt
          grep -q "versionName='0.4.2-internal'" /tmp/kotoba042-qa/package.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > /tmp/kotoba042-qa/signature.txt
      - name: Optimized Play testing build and configuration guards
        id: play_test_guard
        working-directory: kotoba-android
        run: |
          set +e
          gradle --no-daemon prePlayTestBuild > /tmp/kotoba042-qa/play-test-no-stage.txt 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -q 'Select KOTOBA_PLAY_TEST_STAGE' /tmp/kotoba042-qa/play-test-no-stage.txt
          export KOTOBA_PLAY_TEST_STAGE=bootstrap
          set +e
          gradle --no-daemon prePlayTestBuild > /tmp/kotoba042-qa/play-test-no-signing.txt 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -q 'Upload signing is not configured' /tmp/kotoba042-qa/play-test-no-signing.txt
          export KOTOBA_UPLOAD_KEYSTORE=/tmp/kotoba-play-test-fixture.p12
          export KOTOBA_UPLOAD_STORE_PASSWORD=ci-fixture-only
          export KOTOBA_UPLOAD_KEY_ALIAS=ci-fixture
          export KOTOBA_UPLOAD_KEY_PASSWORD=ci-fixture-only
          trap 'rm -f "$KOTOBA_UPLOAD_KEYSTORE"; rm -rf app/build/outputs/apk/playTest app/build/outputs/bundle/playTest' EXIT
          keytool -genkeypair -keystore "$KOTOBA_UPLOAD_KEYSTORE" -storetype PKCS12 -storepass:env KOTOBA_UPLOAD_STORE_PASSWORD -keypass:env KOTOBA_UPLOAD_KEY_PASSWORD -alias "$KOTOBA_UPLOAD_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=CI Fixture Never Upload'
          export KOTOBA_PLAY_TEST_STAGE=sandbox
          set +e
          gradle --no-daemon prePlayTestBuild > /tmp/kotoba042-qa/play-test-no-commerce.txt 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -q 'Verified billing backend is not configured' /tmp/kotoba042-qa/play-test-no-commerce.txt
          export KOTOBA_PLAY_TEST_STAGE=bootstrap
          export KOTOBA_SELLING_ENABLED=true
          set -o pipefail
          gradle --no-daemon assemblePlayTest bundlePlayTest 2>&1 | tee /tmp/kotoba042-qa/play-test-build.txt
          APK=app/build/outputs/apk/playTest/app-playTest.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/kotoba042-qa/play-test-package.txt
          grep -q "name='com.studio501.kotoba'" /tmp/kotoba042-qa/play-test-package.txt
          grep -q "versionName='0.4.2-play-test'" /tmp/kotoba042-qa/play-test-package.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/kotoba042-qa/play-test-manifest.txt
          grep -q 'play_test_bootstrap' /tmp/kotoba042-qa/play-test-manifest.txt
          grep -q '3940256099942544' /tmp/kotoba042-qa/play-test-manifest.txt
          CONFIG=app/build/generated/source/buildConfig/playTest/com/studio501/kotoba/BuildConfig.java
          grep -q 'SELLING_ENABLED = false;' "$CONFIG"
          grep -q 'VERIFICATION_URL = "";' "$CONFIG"
          grep -q 'GOOGLE_OAUTH_CLIENT_ID = "";' "$CONFIG"
          grep -q 'PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER = 0L;' "$CONFIG"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          LC_ALL=C jarsigner -verify -strict -keystore "$KOTOBA_UPLOAD_KEYSTORE" -storepass:env KOTOBA_UPLOAD_STORE_PASSWORD app/build/outputs/bundle/playTest/app-playTest.aab "$KOTOBA_UPLOAD_KEY_ALIAS" | tee /tmp/kotoba042-qa/play-test-aab-signature.txt
          grep -qx 'jar verified\.' /tmp/kotoba042-qa/play-test-aab-signature.txt
          cp "$APK" /tmp/kotoba-play-test-smoke.apk
      - name: Enable emulator acceleration for this runner
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 0600 /dev/kvm
      - name: Prepare actual Android store screenshot capture
        run: |
          cat > /tmp/kotoba-capture-store-screenshots.sh <<'CAPTURE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          CAPTURE_DIR=/tmp/kotoba042-qa/store-screenshots
          mkdir -p "$CAPTURE_DIR/failure-diagnostics"
          adb shell wm size | tr -d '\r' > "$CAPTURE_DIR/display-before.txt"
          adb shell wm density | tr -d '\r' > "$CAPTURE_DIR/density-before.txt"
          ORIGINAL_SIZE_OVERRIDE=$(sed -n 's/^Override size: //p' "$CAPTURE_DIR/display-before.txt")
          cleanup_capture() {
            local FAILED=0
            if [ -n "$ORIGINAL_SIZE_OVERRIDE" ]; then adb shell wm size "$ORIGINAL_SIZE_OVERRIDE" || FAILED=1; else adb shell wm size reset || FAILED=1; fi
            adb shell wm size | tr -d '\r' > "$CAPTURE_DIR/display-restored.txt" || FAILED=1
            adb shell wm density | tr -d '\r' > "$CAPTURE_DIR/density-restored.txt" || FAILED=1
            cmp "$CAPTURE_DIR/display-before.txt" "$CAPTURE_DIR/display-restored.txt" || FAILED=1
            cmp "$CAPTURE_DIR/density-before.txt" "$CAPTURE_DIR/density-restored.txt" || FAILED=1
            adb shell am force-stop com.studio501.kotoba.debug || FAILED=1
            adb shell pm clear com.studio501.kotoba.debug | tr -d '\r' > "$CAPTURE_DIR/debug-data-cleanup.txt" || FAILED=1
            grep -qx Success "$CAPTURE_DIR/debug-data-cleanup.txt" || FAILED=1
            return "$FAILED"
          }
          # Attempt every cleanup action even if restoration fails; never publish success after failed cleanup.
          trap 'CAPTURE_STATUS=$?; if ! cleanup_capture; then CAPTURE_STATUS=1; fi; if [ "$CAPTURE_STATUS" -ne 0 ]; then rm -f "$CAPTURE_DIR/capture-manifest.json"; for FILE in 01-home.jpg 02-vocabulary-search.jpg 03-study-example.jpg 04-handwriting.jpg; do if [ -f "$CAPTURE_DIR/$FILE" ]; then mv "$CAPTURE_DIR/$FILE" "$CAPTURE_DIR/failure-diagnostics/$FILE"; fi; done; fi; exit "$CAPTURE_STATUS"' EXIT
          # This is the render surface itself. Images are never resized or edited.
          adb shell wm size 1080x1920
          adb shell wm size | tr -d '\r' > "$CAPTURE_DIR/display-capture.txt"
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm clear com.studio501.kotoba.debug | tr -d '\r' | tee "$CAPTURE_DIR/debug-data-reset.txt" | grep -qx Success
          set +e
          adb shell am instrument -w -e class com.studio501.kotoba.StoreScreenshotTest -e captureStoreScreenshots true com.studio501.kotoba.debug.test/androidx.test.runner.AndroidJUnitRunner | tr -d '\r' | tee "$CAPTURE_DIR/instrumentation.txt"
          INSTRUMENT_EXIT=${PIPESTATUS[0]}
          set -e
          # Export only fixed diagnostics first; no app database or preferences leave the emulator.
          for FILE in capture-manifest.json failure-diagnostics/failure-state.json failure-diagnostics/failure-ui.jpg; do
            DESTINATION="$CAPTURE_DIR/$FILE"
            if [ "$FILE" = capture-manifest.json ]; then DESTINATION="$CAPTURE_DIR/device-capture-manifest.json"; fi
            adb exec-out run-as com.studio501.kotoba.debug cat "files/store-screenshots/$FILE" > "$DESTINATION.export-raw" || true
          done
          python - "$CAPTURE_DIR" <<'CAPTURE_DIAGNOSTICS'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for name in ['device-capture-manifest.json', 'failure-diagnostics/failure-state.json', 'failure-diagnostics/failure-ui.jpg']:
              destination = root / name
              raw = destination.with_name(destination.name + '.export-raw')
              data = raw.read_bytes()
              try:
                  if destination.suffix == '.json':
                      assert isinstance(json.loads(data), dict)
                  else:
                      assert len(data) > 10000 and data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9'
              except (AssertionError, ValueError, UnicodeError):
                  # adb may return exit zero with cat error text. Preserve it as text, never as a claimed image.
                  raw.rename(root / 'failure-diagnostics' / (destination.name + '-export.txt'))
              else:
                  raw.rename(destination)
          CAPTURE_DIAGNOSTICS
          test "$INSTRUMENT_EXIT" -eq 0
          grep -Fqx 'OK (1 test)' "$CAPTURE_DIR/instrumentation.txt"
          python - "$CAPTURE_DIR" <<'CAPTURE_READY'
          import json, pathlib, sys
          manifest = json.loads((pathlib.Path(sys.argv[1]) / 'device-capture-manifest.json').read_text())
          assert manifest['status'] == 'complete' and manifest['ageSelectionCompleted'] is True
          assert manifest['tutorialUnknownAgeNoSdkVerified'] is True and len(manifest['screens']) == 4
          CAPTURE_READY
          # Successful image exports remain diagnostic raw bytes until all four pass header/dimension/hash validation.
          for FILE in 01-home.jpg 02-vocabulary-search.jpg 03-study-example.jpg 04-handwriting.jpg; do
            adb exec-out run-as com.studio501.kotoba.debug cat "files/store-screenshots/$FILE" > "$CAPTURE_DIR/failure-diagnostics/$FILE.export-raw" || true
          done
          python - "$CAPTURE_DIR" <<'CAPTURE_VALIDATION'
          import hashlib, json, pathlib, struct, sys, time
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / 'device-capture-manifest.json').read_text())
          expected = ['01-home.jpg', '02-vocabulary-search.jpg', '03-study-example.jpg', '04-handwriting.jpg']
          assert manifest['status'] == 'complete' and manifest['variant'] == 'internal_debug'
          assert manifest['packageName'] == 'com.studio501.kotoba.debug' and manifest['salesEnabled'] is False
          assert manifest['ageSelectionCompleted'] is True and manifest['tutorialUnknownAgeNoSdkVerified'] is True
          assert manifest['imageEditing'] is False and len(manifest['screens']) == 4
          assert [screen['file'] for screen in manifest['screens']] == expected
          def jpeg_size(data):
              assert data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9', 'Invalid JPEG envelope'
              offset = 2
              while offset < len(data):
                  assert data[offset] == 255, 'Invalid JPEG marker'
                  while data[offset] == 255: offset += 1
                  marker = data[offset]; offset += 1
                  if marker in [0xd8, 0xd9] or 0xd0 <= marker <= 0xd7: continue
                  length = struct.unpack_from('>H', data, offset)[0]
                  assert length >= 2 and offset + length <= len(data), 'Invalid JPEG segment'
                  if marker in [0xc0, 0xc1, 0xc2]:
                      bits, height, width, components = struct.unpack_from('>BHHB', data, offset + 2)
                      assert bits == 8 and components == 3, 'Expected three-channel JPEG without alpha'
                      return width, height
                  offset += length
              raise AssertionError('JPEG dimensions missing')
          for screen in manifest['screens']:
              data = (root / 'failure-diagnostics' / (screen['file'] + '.export-raw')).read_bytes()
              assert jpeg_size(data) == (1080, 1920) == (screen['width'], screen['height'])
              assert len(data) == screen['bytes'] and hashlib.sha256(data).hexdigest() == screen['sha256']
              assert screen['format'] == 'JPEG' and screen['capturedAtUnixMillis'] >= manifest['startedAtUnixMillis']
              assert screen['semanticPredicate'] and screen['navigation'] and screen['renderedState']
          for screen in manifest['screens']:
              (root / 'failure-diagnostics' / (screen['file'] + '.export-raw')).rename(root / screen['file'])
          manifest['artifactValidation'] = {'status': 'passed', 'images': 4, 'dimensions': '1080x1920',
                                            'sha256AndJpegHeaderChecked': True, 'validatedAtUnixMillis': int(time.time() * 1000)}
          manifest['status'] = 'validated-cleanup-pending'
          (root / 'pending-capture-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          print('Four actual Android captures validated: JPEG 1080x1920; hashes match runtime manifest; internal debug variant.')
          CAPTURE_VALIDATION
          if ! cleanup_capture; then exit 1; fi
          python - "$CAPTURE_DIR" <<'CAPTURE_COMPLETE'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / 'pending-capture-manifest.json').read_text())
          manifest['status'] = 'complete'
          manifest['artifactValidation']['displayRestorationAndDebugDataCleanup'] = 'passed'
          (root / 'capture-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          (root / 'pending-capture-manifest.json').unlink()
          CAPTURE_COMPLETE
          trap - EXIT
          CAPTURE_SCRIPT
      - name: Actual Android lifecycle instrumentation
        id: native_lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: kotoba-android
          script: |
            adb install -r /tmp/kotoba-play-test-smoke.apk
            adb logcat -c
            adb shell am start -W -n com.studio501.kotoba/.MainActivity > /tmp/kotoba042-qa/optimized-launch.txt
            grep -q 'Status: ok' /tmp/kotoba042-qa/optimized-launch.txt
            adb shell sleep 5
            adb shell dumpsys activity activities > /tmp/kotoba042-qa/optimized-activity.txt
            grep -E 'mResumedActivity|topResumedActivity' /tmp/kotoba042-qa/optimized-activity.txt | grep -q 'com.studio501.kotoba/.MainActivity'
            adb logcat -d -b crash > /tmp/kotoba042-qa/optimized-crash.txt
            test ! -s /tmp/kotoba042-qa/optimized-crash.txt
            adb exec-out screencap -p > /tmp/kotoba042-qa/optimized-home.png
            adb uninstall com.studio501.kotoba
            rm -f /tmp/kotoba-play-test-smoke.apk
            gradle --no-daemon connectedDebugAndroidTest
            bash /tmp/kotoba-capture-store-screenshots.sh
      - name: Summarize actual Android checks without stored artifacts
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.android_build.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity_guard.outcome }}
          PLAY_TEST_OUTCOME: ${{ steps.play_test_guard.outcome }}
          NATIVE_LIFECYCLE_OUTCOME: ${{ steps.native_lifecycle.outcome }}
        run: |
          python3 - <<'ANDROID_SUMMARY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          files = []
          for pattern in ['kotoba-android/app/build/test-results/**/*.xml', 'kotoba-android/app/build/outputs/androidTest-results/**/*.xml']:
              for path in sorted(pathlib.Path('.').glob(pattern)):
                  tree = ET.parse(path).getroot()
                  suites = [tree] if tree.tag == 'testsuite' else list(tree.iter('testsuite'))
                  for suite in suites:
                      for key in totals:
                          totals[key] += int(suite.get(key, '0'))
                  files.append(str(path))
          path = pathlib.Path('/tmp/kotoba042-qa/store-screenshots/capture-manifest.json')
          capture = json.loads(path.read_text(encoding='utf-8')) if path.exists() else None
          result = {'schemaVersion': 1, 'stepOutcomes': {key: os.environ.get(key, 'unknown') for key in
                    ['BUILD_OUTCOME', 'IDENTITY_OUTCOME', 'PLAY_TEST_OUTCOME', 'NATIVE_LIFECYCLE_OUTCOME']},
                    'junitTotals': totals, 'junitXmlFileCount': len(files),
                    'captureStatus': capture.get('status') if isinstance(capture, dict) else None,
                    'captureValidation': capture.get('artifactValidation') if isinstance(capture, dict) else None,
                    'captureScreens': [{key: row.get(key) for key in ['file', 'width', 'height', 'bytes', 'sha256']}
                                       for row in capture.get('screens', [])] if isinstance(capture, dict) else [],
                    'artifactUploadPerformed': False, 'cacheUploadPerformed': False,
                    'imagesExportedForVisualReview': False, 'demonstrationVideoCreated': False, 'productionReleaseApproved': False}
          print('KOTOBA_ANDROID_VERIFICATION_JSON=' + json.dumps(result, separators=(',', ':')))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Android regression and capture diagnostics\n\n')
              summary.write('Existing build, signature, JVM/lint, actual instrumentation and capture/cleanup gates retain their exit status. No cache or artifact upload. Images/binaries are temporary runner files; no image export or visual review is claimed by this summary. It does not prove speech/FGS/video, Play installation, ads, billing or release.\n\n')
              summary.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          ANDROID_SUMMARY
