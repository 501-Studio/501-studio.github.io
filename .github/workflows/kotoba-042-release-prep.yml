name: JLPT Kotoba 042 release preparation
on:
  push:
    branches: [feat/jlpt-kotoba-play-release]
    paths: [jlpt-quest/**, kotoba-android/**, billing-server/**, .github/workflows/kotoba-042-release-prep.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kotoba042-release-prep
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KOTOBA_EVIDENCE_DIR: /tmp/kotoba042-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests and learning assets
        working-directory: jlpt-quest
        run: |
          mkdir -p /tmp/kotoba042-qa
          set -o pipefail
          npm test 2>&1 | tee /tmp/kotoba042-qa/node.txt
          node scripts/verify-bundled-assets.mjs
      - name: Receipt verification tests
        working-directory: billing-server
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Docker privilege drop and durable storage smoke test
        run: |
          docker build -t kotoba-verifier-test billing-server
          docker volume create kotoba-qa-data
          trap 'docker rm -f kotoba-verifier-test || true; docker volume rm kotoba-qa-data || true' EXIT
          docker run -d --name kotoba-verifier-test -p 127.0.0.1:8080:8080 -e SQLITE_PATH=/var/data/kotoba/receipts.sqlite3 -v kotoba-qa-data:/var/data kotoba-verifier-test
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --retry-max-time 45 --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/health > /tmp/kotoba042-qa/backend-health.json
          python -c "import json; d=json.load(open('/tmp/kotoba042-qa/backend-health.json')); assert not d['configured'] and not d['ready']"
          docker exec -u app kotoba-verifier-test python -c "import os,sqlite3; assert os.getuid()!=0; db=sqlite3.connect('/var/data/kotoba/receipts.sqlite3'); db.execute('CREATE TABLE smoke (value TEXT)'); db.execute('INSERT INTO smoke VALUES (?)',('durable',)); db.commit(); db.close()"
          docker restart kotoba-verifier-test
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --retry-max-time 45 --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/health > /tmp/kotoba042-qa/backend-health-restarted.json
          docker exec -u app kotoba-verifier-test python -c "import os,sqlite3,stat; p='/var/data/kotoba/receipts.sqlite3'; assert stat.S_IMODE(os.stat(p).st_mode)==0o600; db=sqlite3.connect(p); assert db.execute('SELECT value FROM smoke').fetchone()[0]=='durable'; db.close(); print('Non-root durable restart passed')"
      - name: Browser regression
        working-directory: jlpt-quest
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/kotoba042-qa/http.txt 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          STATUS=0
          for SUITE in tutorial041 continuation040 autopronounce041 advanced040 personal039 release038 examples038 release037 release036; do
            python "tests/${SUITE}-browser.py" >"/tmp/kotoba042-qa/${SUITE}.txt" 2>&1 || STATUS=1
            cat "/tmp/kotoba042-qa/${SUITE}.txt"
          done
          exit "$STATUS"
      - name: Verify unresolved production checks remain visible
        working-directory: jlpt-quest
        run: |
          set +e
          npm run release:check > /tmp/kotoba042-qa/release-gate.txt 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -q 'RELEASE BLOCKED' /tmp/kotoba042-qa/release-gate.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jlpt-kotoba-042-web-verification
          path: /tmp/kotoba042-qa/
          retention-days: 30
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize current web source
        working-directory: jlpt-quest
        run: npm run android:sync
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android internal APK and AAB, JVM tests and lint
        working-directory: kotoba-android
        run: |
          mkdir -p /tmp/kotoba042-qa
          set -o pipefail
          gradle --no-daemon assembleDebug bundleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug 2>&1 | tee /tmp/kotoba042-qa/gradle.txt
      - name: Verify internal package identity and APK signature
        working-directory: kotoba-android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/kotoba042-qa/package.txt
          grep -q "name='com.studio501.kotoba.debug'" /tmp/kotoba042-qa/package.txt
          grep -q "versionCode='15'" /tmp/kotoba042-qa/package.txt
          grep -q "versionName='0.4.2-internal'" /tmp/kotoba042-qa/package.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > /tmp/kotoba042-qa/signature.txt
      - name: Optimized Play testing build and configuration guards
        working-directory: kotoba-android
        run: |
          set +e
          gradle --no-daemon prePlayTestBuild > /tmp/kotoba042-qa/play-test-no-stage.txt 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -q 'Select KOTOBA_PLAY_TEST_STAGE' /tmp/kotoba042-qa/play-test-no-stage.txt
          export KOTOBA_PLAY_TEST_STAGE=bootstrap
          set +e
          gradle --no-daemon prePlayTestBuild > /tmp/kotoba042-qa/play-test-no-signing.txt 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -q 'Upload signing is not configured' /tmp/kotoba042-qa/play-test-no-signing.txt
          export KOTOBA_UPLOAD_KEYSTORE=/tmp/kotoba-play-test-fixture.p12
          export KOTOBA_UPLOAD_STORE_PASSWORD=ci-fixture-only
          export KOTOBA_UPLOAD_KEY_ALIAS=ci-fixture
          export KOTOBA_UPLOAD_KEY_PASSWORD=ci-fixture-only
          trap 'rm -f "$KOTOBA_UPLOAD_KEYSTORE"; rm -rf app/build/outputs/apk/playTest app/build/outputs/bundle/playTest' EXIT
          keytool -genkeypair -keystore "$KOTOBA_UPLOAD_KEYSTORE" -storetype PKCS12 -storepass:env KOTOBA_UPLOAD_STORE_PASSWORD -keypass:env KOTOBA_UPLOAD_KEY_PASSWORD -alias "$KOTOBA_UPLOAD_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=CI Fixture Never Upload'
          export KOTOBA_PLAY_TEST_STAGE=sandbox
          set +e
          gradle --no-daemon prePlayTestBuild > /tmp/kotoba042-qa/play-test-no-commerce.txt 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -q 'Verified billing backend is not configured' /tmp/kotoba042-qa/play-test-no-commerce.txt
          export KOTOBA_PLAY_TEST_STAGE=bootstrap
          export KOTOBA_SELLING_ENABLED=true
          set -o pipefail
          gradle --no-daemon assemblePlayTest bundlePlayTest 2>&1 | tee /tmp/kotoba042-qa/play-test-build.txt
          APK=app/build/outputs/apk/playTest/app-playTest.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > /tmp/kotoba042-qa/play-test-package.txt
          grep -q "name='com.studio501.kotoba'" /tmp/kotoba042-qa/play-test-package.txt
          grep -q "versionName='0.4.2-play-test'" /tmp/kotoba042-qa/play-test-package.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/kotoba042-qa/play-test-manifest.txt
          grep -q 'play_test_bootstrap' /tmp/kotoba042-qa/play-test-manifest.txt
          grep -q '3940256099942544' /tmp/kotoba042-qa/play-test-manifest.txt
          CONFIG=app/build/generated/source/buildConfig/playTest/com/studio501/kotoba/BuildConfig.java
          grep -q 'SELLING_ENABLED = false;' "$CONFIG"
          grep -q 'VERIFICATION_URL = "";' "$CONFIG"
          grep -q 'GOOGLE_OAUTH_CLIENT_ID = "";' "$CONFIG"
          grep -q 'PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER = 0L;' "$CONFIG"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          jarsigner -verify app/build/outputs/bundle/playTest/app-playTest.aab
      - name: Enable emulator acceleration for this runner
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 0600 /dev/kvm
      - name: Actual Android lifecycle instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: kotoba-android
          script: gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: jlpt-kotoba-042-internal
          path: |
            kotoba-android/app/build/outputs/apk/debug/*.apk
            kotoba-android/app/build/outputs/bundle/debug/*.aab
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jlpt-kotoba-042-android-verification
          path: |
            /tmp/kotoba042-qa/
            kotoba-android/app/build/reports/
            kotoba-android/app/build/test-results/
          retention-days: 30
