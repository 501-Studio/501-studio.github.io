name: Kotoba complete offline data packs
on:
  push:
    branches: [feat/kotoba-v03-android-course]
    paths: [jlpt-quest/scripts/prepare_content.py, .github/workflows/kotoba-stroke-pack.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build all pinned words and stroke templates
        run: python3 jlpt-quest/scripts/prepare_content.py
      - uses: actions/upload-artifact@v4
        with:
          name: kotoba-offline-data
          path: jlpt-quest/web/data/
          if-no-files-found: error
          retention-days: 30
