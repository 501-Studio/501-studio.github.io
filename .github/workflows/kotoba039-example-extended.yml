name: Kotoba 039 extended example coverage
on:
  push:
    branches: [feat/kotoba-039-examples-study]
    paths: [release/extend-examples039.py, .github/workflows/kotoba039-example-extended.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install fugashi==1.5.2 unidic-lite==1.0.8
      - run: python release/extend-examples039.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: examples039-extended
          path: /tmp/examples039-extended/
          retention-days: 30
