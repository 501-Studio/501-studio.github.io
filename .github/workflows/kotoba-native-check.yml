name: Kotoba Android native compile verification
on:
  push:
    branches: [feat/kotoba-v03-android-course]
    paths: [jlpt-quest/android/**, .github/workflows/kotoba-native-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify native source compilation and Android lint
        working-directory: jlpt-quest/android
        run: gradle :app:compileDebugJavaWithJavac :app:lintDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotoba-native-compile-report
          path: jlpt-quest/android/app/build/reports/
          retention-days: 30
