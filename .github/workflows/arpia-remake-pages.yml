name: Arpia Remake — Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'arpia-remake/**'
      - 'index.html'
      - '.github/workflows/arpia-remake-pages.yml'
  pull_request:
    paths:
      - 'arpia-remake/**'
      - '.github/workflows/arpia-remake-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: arpia-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arpia-remake/package-lock.json

      - name: Install
        working-directory: arpia-remake
        run: npm install

      - name: Check and build
        working-directory: arpia-remake
        run: npm run check

      - name: Assemble Pages site
        run: |
          mkdir -p _site/arpia-remake
          cp index.html _site/index.html
          cp -R arpia-remake/dist/. _site/arpia-remake/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}arpia-remake/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
