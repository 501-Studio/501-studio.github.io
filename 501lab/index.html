<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>501 Lab — Coming Soon</title>
  <meta name="description" content="501 Lab is currently preparing its new website." />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f9fc;
      color: #111827;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(720px, 100%);
      text-align: center;
    }
    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #111827;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
    }
    h1 {
      margin: 0;
      font-size: clamp(44px, 8vw, 78px);
      line-height: 1;
      letter-spacing: -0.055em;
    }
    p {
      margin: 24px auto 0;
      max-width: 520px;
      color: #6b7280;
      font-size: 18px;
      line-height: 1.7;
    }
    .status {
      display: inline-block;
      margin-top: 32px;
      padding: 8px 13px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: #fff;
      color: #4b5563;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    footer {
      margin-top: 56px;
      color: #9ca3af;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">501</div>
    <h1>501 Lab</h1>
    <p>We’re preparing something new.<br />Our website will be available soon.</p>
    <div class="status">COMING SOON</div>
    <footer>© 2026 501 Lab.</footer>
  </main>
</body>
</html>
